# South Africa 2023 fixed-capacity validation overlay.

countries: ["ZA"]

run:
  name: za_2023_fixed_validation
  shared_cutouts: true

scenario:
  simpl: [""]
  clusters: [34]
  ll: ["c1"]
  opts: ["NoCO2-1H"]

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"
  inclusive: "left"

enable:
  retrieve_cutout: false
  build_cutout: false
  custom_busmap: true
  za_input_data_regeneration: false

costs:
  year: 2030
  output_currency: ZAR
  electricity_grid_connection: 0

atlite:
  default: cutout-2023-era5
  cutouts:
    cutout-2023-era5:
      module: era5
      dx: 0.3
      dy: 0.3

load_options:
  ssp: ssp2-2.6
  weather_year: 2023_calibrated
  prediction_year: 2030
  scale: 1

cluster_options:
  simplify_network:
    p_threshold_drop_isolated: 20
    s_threshold_fetch_isolated: false

electricity:
  co2limit: null
  custom_powerplants: replace
  powerplants_filter: (DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)
  estimate_renewable_capacities:
    stats: false
  conventional_carriers: [coal, nuclear]
  renewable_carriers: [solar, onwind, hydro, csp]
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

solving:
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 2
      method: 2
      crossover: 0
      BarConvTol: 1.e-5
      OptimalityTol: 1.e-6
      FeasibilityTol: 1.e-6
  options:
    load_shedding: true
    noisy_costs: false

renewable:
  hydro:
    multiplier: 1.20

za:
  isolated_load_transfer:
    enable: true
    audit: data/za_audit/za_isolated_load_transfer.csv

za_reference_data:
  pypsa_rsa_benchmark_2023: data/za_reference/pypsa_rsa_benchmark_2023
  pypsa_rsa_coal_flexibilisation: data/za_reference/pypsa_rsa_coal_flexibilisation
  supply_regions: data/za_reference/supply_regions/rsa_supply_regions.gpkg

za_source_audits:
  enable: false
  pypsa_rsa_root: ../pypsa-rsa
  pypsa_rsa_pinned_commit: 0831ce243f0badbba6f09b418c2b57774ea89a5f

za_fleet:
  enable: true
  custom_powerplants: data/custom_powerplants.csv
  source: calibrated_2023
  exclude_powerplants:
    - Kelvin
    - Sasol coal
    - Sasol gas
  backup_before_mutation: true
  backup_dir: data/za_audit/backups

za_coal_disaggregation:
  enable: true
  availability_mode: rsa_eaf_projected
  outage_profiles_scenario: BASE
  annual_availability_scenario: EAF_48
  annual_availability_target_override:
    coal: 0.485
  plants_csv: data/za_validation/za_coal_plants_2023.csv
  eaf_hourly_csv: data/za_validation/za_coal_eaf_hourly_2023.csv
  bus_assignment_csv: data/za_validation/za_coal_bus_assignment.csv
  uc:
    enable: true
    msl_mode: scale_by_p_max_pu
    p_min_pu_base: 0.7
    ramp_multiplier: 1.5
    apply_min_up_down_time: false
    clean_pu_profiles: true
    min_ramp_limit_threshold: 0.05

za_operational_constraints:
  enable: false
  scenario: NO_MIN_GAS
  model_year: 2023

za_generation_constraints:
  annual_generation_caps:
    enable: false
    unit: TWh
    model_year: 2023
    carriers: {}

za_profile_scaling:
  enable: false
  carriers: {}

za_availability_overrides:
  static_p_max_pu:
    enable: false
    carriers: {}

za_local_carriers:
  ocgt_diesel:
    component: Generator
    color: "#cc6633"
    nice_name: OCGT diesel
    profile_intent: peaker; high marginal cost
    emissions_intent: explicit local cost row
    validation_target: Eskom 2023 OCGT/diesel reconciliation
    availability_treatment: fixed fleet input
  ocgt_gas:
    component: Generator
    color: "#d35050"
    nice_name: OCGT gas
    profile_intent: peaker
    emissions_intent: explicit local cost row
    validation_target: Eskom 2023 OCGT/gas reconciliation
    availability_treatment: fixed fleet input
  sasol_coal:
    component: Generator
    color: "#6f4e37"
    nice_name: Sasol coal
    profile_intent: optional non-UC diagnostic
    emissions_intent: explicit local cost row
    validation_target: diagnostic only
    availability_treatment: fixed p_max_pu unless capped by diagnostic
  sasol_gas:
    component: Generator
    color: "#b56576"
    nice_name: Sasol gas
    profile_intent: optional non-UC diagnostic
    emissions_intent: explicit local cost row
    validation_target: diagnostic only
    availability_treatment: fixed p_max_pu unless capped by diagnostic

za_grid_spatial:
  spatial_level: 34
  source_decision: Stage 4b
  pypsa_rsa_supply_regions_layer: 34
  line_voltage_threshold_kv: 220
  st_clair_coefficients: [53.736, -0.65]
  s_max_pu: 0.7
  n1_approx_single_lines: 0.7
  sil_mw:
    220: 122
    275: 245
    400: 602
    765: 2280
  thermal_mw:
    220: 492
    275: 921
    400: 1788
    765: 5512
