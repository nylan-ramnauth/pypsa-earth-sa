# Config overlay for the ZA 2023 coal 48.5% + nuclear 50% validation scenario
# with VRE profile scaling and an OCGT diesel annual generation cap.

za_scenario:
  label: coal485_nuclear50_vre_ocgt_cap
  description: Coal 48.5%, nuclear 50%, VRE scaling, OCGT cap

za_operational_constraints:
  enable: true
  scenario: LOW_GAS
  model_year: 2023

za_generation_constraints:
  annual_generation_caps:
    enable: true
    unit: TWh
    model_year: 2023
    carriers:
      nuclear: 8.127
      ocgt_diesel: 5.243

za_profile_scaling:
  enable: true
  carriers:
    onwind: 1.58
    solar: 1.40

za_availability_overrides:
  static_p_max_pu:
    enable: true
    carriers:
      nuclear: 0.5
